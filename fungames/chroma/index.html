<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chroma</title>
<style>
/* Layout: one centered column, a single color orb as the hero, iOS-style sliders below, one primary action */
:root {
  --bg: #f5f5f7;
  --surface: #ffffff;
  --fg: #1d1d1f;
  --muted: #6e6e73;
  --line: rgba(0, 0, 0, .08);
  --accent: #0071e3;
  --on-accent: #ffffff;
  --thumb: #ffffff;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 32px rgba(0,0,0,.06);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #1c1c1e; --fg: #f5f5f7; --muted: #98989d;
    --line: rgba(255,255,255,.1); --accent: #2997ff; --on-accent: #ffffff;
    --shadow: 0 0 0 1px rgba(255,255,255,.06); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #1c1c1e; --fg: #f5f5f7; --muted: #98989d;
  --line: rgba(255,255,255,.1); --accent: #2997ff; --on-accent: #ffffff;
  --shadow: 0 0 0 1px rgba(255,255,255,.06); color-scheme: dark;
}
[hidden] { display: none !important; }

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg); color: var(--fg); font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  display: flex; justify-content: center; align-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 24px; padding-block: 24px; }

header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
.meta { display: flex; gap: 16px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta b { color: var(--fg); font-weight: 600; }

.stage { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.orb {
  position: relative; width: min(72vw, 260px); max-width: 100%; aspect-ratio: 1;
  border-radius: 50%; overflow: hidden; box-shadow: var(--shadow);
  background: var(--surface);
}
.orb .layer { position: absolute; inset: 0; transition: clip-path .7s cubic-bezier(.2,.8,.2,1), background-color .15s; }
.orb .yours { clip-path: inset(0 0 0 0); }
.orb.split .yours { clip-path: inset(0 0 0 50%); }
.orb.hide-yours .yours { clip-path: inset(0 0 0 100%); }
.orb .tag {
  position: absolute; bottom: 18%; font-size: 11px; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; color: rgba(255,255,255,.92); text-shadow: 0 1px 3px rgba(0,0,0,.35);
  opacity: 0; transition: opacity .4s .3s;
}
.orb .tag.l { left: 18%; } .orb .tag.r { right: 18%; }
.orb.split .tag { opacity: 1; }

.status { min-height: 44px; text-align: center; display: flex; flex-direction: column; gap: 4px; align-items: center; }
.status .big { font-size: 40px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1; }
.status .line { font-size: 15px; color: var(--muted); text-wrap: balance; }
.status .line strong { color: var(--fg); font-weight: 600; }

.timer { width: 140px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.timer i { display: block; height: 100%; width: 100%; background: var(--fg); transform-origin: left; }

.panel {
  background: var(--surface); border-radius: 22px; padding: 20px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 18px; transition: opacity .3s;
}
.panel.off { opacity: .35; pointer-events: none; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field label { display: flex; justify-content: space-between; font-size: 13px; font-weight: 500; color: var(--muted); }
.field label span { color: var(--fg); font-variant-numeric: tabular-nums; }

input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 28px; margin: 0;
  border-radius: 14px; background: var(--track, var(--line)); box-shadow: inset 0 0 0 1px var(--line);
  outline: none; cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; border: none;
  background: var(--thumb); box-shadow: 0 0 0 .5px rgba(0,0,0,.06), 0 3px 8px rgba(0,0,0,.18);
}
input[type=range]::-moz-range-thumb {
  width: 28px; height: 28px; border-radius: 50%; border: none;
  background: var(--thumb); box-shadow: 0 0 0 .5px rgba(0,0,0,.06), 0 3px 8px rgba(0,0,0,.18);
}
input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.results { display: flex; justify-content: space-between; gap: 8px; }
.result { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--muted); }
.mini { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; display: flex; box-shadow: inset 0 0 0 1px var(--line); }
.mini i { flex: 1; }
.summary-line { font-size: 15px; color: var(--muted); text-align: center; }
.summary-line strong { color: var(--fg); }

button {
  font: inherit; font-size: 17px; font-weight: 500; border: none; cursor: pointer;
  background: var(--accent); color: var(--on-accent); border-radius: 980px;
  padding: 14px 28px; align-self: center; min-width: 180px;
  transition: transform .15s, opacity .2s;
}
button:active { transform: scale(.97); }
button:disabled { opacity: .4; cursor: default; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.hint { text-align: center; font-size: 12px; color: var(--muted); margin-top: -12px; }

@media (prefers-reduced-motion: reduce) {
  .orb .layer, .orb .tag, .panel, button { transition: none; }
}
</style>
</head>
<body>

<main>
  <header>
    <h1>Chroma</h1>
    <div class="meta">
      <div>Round <b id="round">–</b> of 5</div>
      <div>Score <b id="total">0.0</b></div>
    </div>
  </header>

  <section class="stage">
    <div class="orb hide-yours" id="orb">
      <div class="layer target" id="targetLayer"></div>
      <div class="layer yours" id="yoursLayer"></div>
      <span class="tag l">Original</span>
      <span class="tag r">Yours</span>
    </div>
    <div class="status" id="status"></div>
  </section>

  <section class="panel off" id="panel">
    <div class="field">
      <label for="h">Hue <span id="hv">0°</span></label>
      <input type="range" id="h" min="0" max="359" value="200">
    </div>
    <div class="field">
      <label for="s">Saturation <span id="sv">0%</span></label>
      <input type="range" id="s" min="0" max="100" value="50">
    </div>
    <div class="field">
      <label for="b">Brightness <span id="bv">0%</span></label>
      <input type="range" id="b" min="0" max="100" value="70">
    </div>
  </section>

  <section class="panel" id="summary" hidden>
    <div class="results" id="results"></div>
    <div class="summary-line" id="best"></div>
  </section>

  <button id="action" type="button">Start</button>
  <div class="hint" id="hint">You get 3 seconds to look. Then rebuild the color from memory.</div>
</main>

<script>
(() => {
  const ROUNDS = 5, LOOK_MS = 3000;
  const $ = id => document.getElementById(id);
  const orb = $('orb'), targetLayer = $('targetLayer'), yoursLayer = $('yoursLayer');
  const statusEl = $('status'), panel = $('panel'), summary = $('summary');
  const action = $('action'), hint = $('hint');
  const sliders = { h: $('h'), s: $('s'), b: $('b') };

  let phase = 'intro', round = 0, total = 0, results = [], target, timerId;

  function hsb(h, s, v) {
    s /= 100; v /= 100;
    const f = n => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
    return [f(5), f(3), f(1)].map(x => Math.round(x * 255));
  }
  const css = c => `rgb(${hsb(c.h, c.s, c.b).join(',')})`;

  function lab([r, g, b]) {
    const lin = c => { c /= 255; return c > .04045 ? ((c + .055) / 1.055) ** 2.4 : c / 12.92; };
    [r, g, b] = [r, g, b].map(lin);
    const x = (r * .4124 + g * .3576 + b * .1805) / .95047;
    const y = (r * .2126 + g * .7152 + b * .0722);
    const z = (r * .0193 + g * .1192 + b * .9505) / 1.08883;
    const f = t => t > .008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
    return [116 * f(y) - 16, 500 * (f(x) - f(y)), 200 * (f(y) - f(z))];
  }
  function scoreOf(a, b) {
    const [l1, a1, b1] = lab(hsb(a.h, a.s, a.b)), [l2, a2, b2] = lab(hsb(b.h, b.s, b.b));
    const dE = Math.hypot(l1 - l2, a1 - a2, b1 - b2);
    return Math.round(Math.max(0, 1 - dE / 55) * 100) / 10;
  }
  const verdict = s => s >= 9.5 ? 'Perfect eye' : s >= 8 ? 'Very close' : s >= 6 ? 'Close' : s >= 4 ? 'Getting there' : 'Way off';

  const guess = () => ({ h: +sliders.h.value, s: +sliders.s.value, b: +sliders.b.value });
  const rand = (a, b) => Math.round(a + Math.random() * (b - a));

  function paintSliders() {
    const g = guess();
    const hueStops = [0, 60, 120, 180, 240, 300, 360].map(h => css({ h, s: Math.max(g.s, 30), b: Math.max(g.b, 40) })).join(',');
    sliders.h.style.setProperty('--track', `linear-gradient(90deg, ${hueStops})`);
    sliders.s.style.setProperty('--track', `linear-gradient(90deg, ${css({ ...g, s: 0 })}, ${css({ ...g, s: 100 })})`);
    sliders.b.style.setProperty('--track', `linear-gradient(90deg, #000, ${css({ ...g, b: 100 })})`);
    $('hv').textContent = g.h + '°'; $('sv').textContent = g.s + '%'; $('bv').textContent = g.b + '%';
    yoursLayer.style.backgroundColor = css(g);
  }
  Object.values(sliders).forEach(el => el.addEventListener('input', paintSliders));

  function setStatus(html) { statusEl.innerHTML = html; }
  function updateMeta() {
    $('round').textContent = round || '–';
    $('total').textContent = total.toFixed(1);
  }

  function startRound() {
    round++; phase = 'memorize'; updateMeta();
    target = { h: rand(0, 359), s: rand(30, 95), b: rand(40, 95) };
    targetLayer.style.backgroundColor = css(target);
    orb.className = 'orb hide-yours';
    panel.classList.add('off'); panel.hidden = false; summary.hidden = true;
    action.disabled = true; action.textContent = 'Memorize…';
    hint.textContent = 'Look closely.';
    setStatus('<div class="timer"><i id="bar"></i></div><div class="line">Remember this color</div>');
    const bar = $('bar');
    bar.animate([{ transform: 'scaleX(1)' }, { transform: 'scaleX(0)' }], { duration: LOOK_MS, easing: 'linear', fill: 'forwards' });
    timerId = setTimeout(startBuild, LOOK_MS);
  }

  function startBuild() {
    phase = 'build';
    sliders.h.value = rand(0, 359); sliders.s.value = 50; sliders.b.value = 70;
    paintSliders();
    orb.className = 'orb';
    panel.classList.remove('off');
    action.disabled = false; action.textContent = 'Lock In';
    hint.textContent = 'Press Return to lock in.';
    setStatus('<div class="line">Now rebuild it from memory</div>');
    sliders.h.focus({ preventScroll: true });
  }

  function lockIn() {
    phase = 'reveal';
    const g = guess(), s = scoreOf(target, g);
    total += s; results.push({ target, guess: g, score: s }); updateMeta();
    orb.className = 'orb split';
    panel.classList.add('off');
    let dh = ((g.h - target.h + 540) % 360) - 180;
    const sign = n => (n > 0 ? '+' : n < 0 ? '−' : '±') + Math.abs(n);
    setStatus(`<div class="big">${s.toFixed(1)}</div>
      <div class="line"><strong>${verdict(s)}.</strong> Hue ${sign(dh)}°, saturation ${sign(g.s - target.s)}, brightness ${sign(g.b - target.b)}.</div>`);
    action.textContent = round < ROUNDS ? 'Next Color' : 'See Results';
    hint.textContent = 'Each round scores up to 10.';
  }

  function finish() {
    phase = 'done';
    let best = 0;
    try { best = +(localStorage.getItem('chroma-best') || 0); } catch (e) {}
    const isBest = total > best;
    if (isBest) { best = total; try { localStorage.setItem('chroma-best', total.toFixed(1)); } catch (e) {} }
    panel.hidden = true; summary.hidden = false;
    $('results').innerHTML = results.map(r =>
      `<div class="result"><div class="mini"><i style="background:${css(r.target)}"></i><i style="background:${css(r.guess)}"></i></div>${r.score.toFixed(1)}</div>`).join('');
    $('best').innerHTML = isBest ? '<strong>New personal best.</strong>' : `Your best is <strong>${best.toFixed(1)}</strong>.`;
    const avg = total / ROUNDS;
    setStatus(`<div class="big">${total.toFixed(1)}<span style="font-size:20px;color:var(--muted);font-weight:500"> / 50</span></div>
      <div class="line">${avg >= 8.5 ? 'You have a designer’s eye.' : avg >= 6.5 ? 'A sharp memory for color.' : 'Color memory takes practice. Try again.'}</div>`);
    action.textContent = 'Play Again';
    hint.textContent = 'Left half is the original, right half is yours.';
  }

  function reset() { round = 0; total = 0; results = []; updateMeta(); startRound(); }

  action.addEventListener('click', () => {
    if (phase === 'intro' || phase === 'done') reset();
    else if (phase === 'build') lockIn();
    else if (phase === 'reveal') round < ROUNDS ? startRound() : finish();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !action.disabled && document.activeElement !== action) { e.preventDefault(); action.click(); }
  });

  // Intro: show a sample color so the first frame isn't empty
  targetLayer.style.backgroundColor = css({ h: 211, s: 78, b: 92 });
  setStatus('<div class="line">How well do you <strong>remember color?</strong></div>');
  paintSliders();
})();
</script>

</body>
</html>
