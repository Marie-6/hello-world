<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>First Case</title>
  <link rel="stylesheet" type="text/css" href="style.css">
  <script src="libraries/p5.min.js"></script>
</head>

<body>
  <div class="container">
    <h1 class="title">FIRST CASE</h1>

    <!-- status bar: sanity, item, clues -->
    <div class="status">
      <span id="sanity"></span>
      <span id="item"></span>
      <span id="clues"></span>
    </div>

    <!-- the story text appears here -->
    <div id="story" class="story"></div>

    <!-- the choice buttons appear here -->
    <div id="choices" class="choices"></div>
  </div>

  <script src="sketch.js"></script>
</body>

</html>
