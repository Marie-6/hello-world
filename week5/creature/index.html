<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pocket Critter</title>
  </head>
  <body>
    <main>
      <!-- stats + buttons, shown after it hatches -->
      <div id="hud" class="hidden">
        <div class="panel">
          <div class="name"><span id="petName"></span> <span id="petStage"></span></div>
          <div class="stat"><span>FULL</span><div class="bar"><i id="barFull"></i></div></div>
          <div class="stat"><span>ENERGY</span><div class="bar"><i id="barEnergy"></i></div></div>
          <div class="stat"><span>HAPPY</span><div class="bar"><i id="barJoy"></i></div></div>
          <div class="stat"><span>GROW</span><div class="bar"><i id="barGrow"></i></div></div>
        </div>
        <div class="buttons">
          <button id="feedBtn">FEED</button>
          <button id="sleepBtn">SLEEP</button>
          <button id="closetBtn">CLOSET</button>
        </div>
      </div>

      <!-- the closet: hats and clothes -->
      <div id="closet" class="hidden">
        <div class="closet-head">CLOSET <button id="closetClose">X</button></div>
        <p class="shelf-label">HATS</p>
        <div id="hatShelf" class="shelf"></div>
        <p class="shelf-label">CLOTHES</p>
        <div id="clothShelf" class="shelf"></div>
      </div>

      <!-- first meeting: give it a name -->
      <form id="namer" class="hidden">
        <p>It hatched!<br><span id="hatchText"></span><br><br>What will you<br>call it?</p>
        <input id="nameInput" maxlength="12" autocomplete="off" placeholder="Mochi">
        <button type="submit">OK</button>
      </form>

      <p id="tip" class="hidden">wiggle the mouse on it to pet · click the grass to drop a berry</p>
      <button id="resetBtn" class="hidden">new egg</button>
    </main>
    <script src="sketch.js"></script>
  </body>
</html>
